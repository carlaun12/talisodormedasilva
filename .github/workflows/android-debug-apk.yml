name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - ui/remove-day-details-and-monthly-summary

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Ensure Gradle Wrapper is executable
        run: chmod +x ./gradlew
      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: talisodormedasilva-debug-${{ github.sha }}-${{ github.run_id }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Publish directly downloadable debug APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          # One mutable prerelease per branch, providing a stable direct APK URL.
          branch_slug="$(printf '%s' "$GITHUB_REF_NAME" | sed 's/[^[:alnum:]._-]/-/g')"
          release_tag="debug-${branch_slug}"
          apk_path="app/build/outputs/apk/debug/app-debug.apk"
          apk_name="app-debug.apk"
          release_notes="Build de desenvolvimento (não destinado a produção). Branch: ${GITHUB_REF_NAME}. Commit: ${GITHUB_SHA}. Android Debug APK, assinado com a chave de depuração."

          test -s "$apk_path"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" "$apk_path" --clobber
            gh release edit "$release_tag" --notes "$release_notes"
          else
            gh release create "$release_tag" "$apk_path" \
              --target "$GITHUB_SHA" \
              --title "APK Debug — ${GITHUB_REF_NAME}" \
              --notes "$release_notes" \
              --prerelease
          fi

          direct_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}/${apk_name}"
          {
            echo "## APK pronto para baixar"
            echo ""
            echo "[Baixar APK diretamente](${direct_url})"
            echo ""
            echo "Branch: \`${GITHUB_REF_NAME}\`"
            echo ""
            echo "Commit: \`${GITHUB_SHA}\`"
            echo ""
            echo "APK de depuração; a release é pública neste repositório público."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Direct APK: $direct_url"
